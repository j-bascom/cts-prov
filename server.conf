# /etc/openvpn/server/server.conf
# Managed by CTS

port 1194
proto udp
dev tun

ca   /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/server.crt
key  /etc/openvpn/server/server.key
dh   /etc/openvpn/server/dh.pem

# CRL — updated by cert_engine on revocation
crl-verify /etc/openvpn/easy-rsa/pki/crl.pem

# Allocate IPs from the full subnet (not the wasteful /30 pair default)
topology subnet
server 10.8.0.0 255.255.240.0

# Push all traffic through the tunnel so SIP/RTP goes via our IP
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 1.1.1.1"

# Keep connections alive through NAT firewalls
keepalive 10 120

# Security
cipher AES-256-GCM
auth SHA256
tls-auth /etc/openvpn/server/ta.key 0
tls-version-min 1.2

# Drop privileges after init
user nobody
group nogroup

persist-key
persist-tun

# IP pool persistence — phones keep same tunnel IP across reconnects
ifconfig-pool-persist /var/log/openvpn/ipp.txt

status      /var/log/openvpn/status.log
log-append  /var/log/openvpn/openvpn.log
verb 3
