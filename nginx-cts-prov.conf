# /etc/nginx/sites-available/cts-prov
# Managed by CTS — do not edit manually

# Redirect HTTP to HTTPS (certbot will also add this)
server {
    listen 80;
    server_name prov.yourcompany.com;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name prov.yourcompany.com;

    # TLS — certbot will populate these
    ssl_certificate     /etc/letsencrypt/live/prov.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prov.yourcompany.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Yealink phones send large config fetches — be generous with timeouts
    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;
    client_max_body_size  10m;

    # Provisioning endpoints
    location /provision/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # VPN bundle download
    location /vpn/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Admin API — restrict to your office IP in production
    location /admin/ {
        # Uncomment and set your office/management IP:
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check (public — for monitoring)
    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # API docs (restrict in production)
    location /docs {
        proxy_pass http://127.0.0.1:8000;
    }

    access_log  /var/log/nginx/cts-prov-access.log;
    error_log   /var/log/nginx/cts-prov-error.log;
}
