# Fail2ban filter: CTS provisioning proxy — admin API + dashboard login failures
#
# Matches two patterns in the nginx access log:
#   1. HTTP 403 on /admin/* — invalid or missing X-Admin-Token header
#   2. HTTP 401 on POST /dashboard/login — bad username or password
#
# Both return non-2xx so nginx logs them; fail2ban bans the source IP after
# LOGIN_MAX attempts within findtime (configured in jail.d/cts-prov.conf).
[Definition]
failregex = ^<HOST> .+ "(GET|POST|DELETE|PUT|PATCH) /admin/[^ ]* HTTP/[0-9.]+" 403
            ^<HOST> .+ "POST /dashboard/login HTTP/[0-9.]+" 401
ignoreregex =
